name: Build and push
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Sing in to Docker hub
      uses: docker/login-action@v4
      with:
        username: pruthvis02
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        push: true
        tabs: pruthvis02/ci-demo:latest